name: Format pose branch

on:
  push:
    branches:
      - feature/pose-fixed-scale-fragments

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pose-fixed-scale-fragments
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        working-directory: rustcpd
        run: cargo fmt
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rustcpd/src/pose.rs
          git commit -m "Apply cargo fmt"
          git push origin HEAD:feature/pose-fixed-scale-fragments
