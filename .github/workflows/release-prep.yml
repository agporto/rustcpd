name: Finalize 3.1.0 release metadata

on:
  push:
    branches:
      - feature/pose-landmark-keypoints
    paths:
      - .github/workflows/release-prep.yml

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pose-landmark-keypoints
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.87.0

      - name: Synchronize Cargo.lock
        shell: bash
        run: |
          cargo check --workspace
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          lock = tomllib.loads(Path("Cargo.lock").read_text())
          versions = {
              package["name"]: package["version"]
              for package in lock["package"]
              if package["name"] in {"rustcpd", "rustcpd-python"}
          }
          expected = {"rustcpd": "3.1.0", "rustcpd-python": "3.1.0"}
          if versions != expected:
              raise SystemExit(f"unexpected workspace versions: {versions}")

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", "Cargo.lock"],
              text=True,
          )
          changed = [
              line
              for line in diff.splitlines()
              if line[:1] in {"+", "-"}
              and not line.startswith(("+++", "---"))
          ]
          expected_changed = [
              '-version = "3.0.0"',
              '+version = "3.1.0"',
              '-version = "3.0.0"',
              '+version = "3.1.0"',
          ]
          if changed != expected_changed:
              raise SystemExit(
                  "Cargo.lock changed beyond the two workspace versions:\n" + diff
              )
          PY

      - name: Finalize changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          heading = "## [Unreleased]\n\n### Added\n"
          released = "## [Unreleased]\n\n## [3.1.0] - 2026-08-18\n\n### Added\n"
          if heading not in text:
              raise SystemExit("expected Unreleased heading was not found")
          text = text.replace(heading, released, 1)

          previous_link = (
              "[3.0.0]: https://github.com/agporto/rustcpd/releases/tag/v3.0.0"
          )
          release_link = (
              "[3.1.0]: https://github.com/agporto/rustcpd/releases/tag/v3.1.0"
          )
          if previous_link not in text:
              raise SystemExit("expected 3.0.0 changelog link was not found")
          if release_link not in text:
              text = text.replace(
                  previous_link,
                  release_link + "\n" + previous_link,
                  1,
              )
          path.write_text(text)

          final = path.read_text()
          if "## [Unreleased]\n\n## [3.1.0] - 2026-08-18" not in final:
              raise SystemExit("3.1.0 release heading was not written")
          if final.count(release_link) != 1:
              raise SystemExit("3.1.0 release link is missing or duplicated")
          PY

      - name: Commit release preparation
        shell: bash
        run: |
          rm .github/workflows/release-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Cargo.lock CHANGELOG.md .github/workflows/release-prep.yml
          git diff --cached --check
          git commit -m "Finalize 3.1.0 release metadata"
          git push origin HEAD:feature/pose-landmark-keypoints

      - name: Run final validation on the prepared commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run rust.yml --ref feature/pose-landmark-keypoints
          gh workflow run wheels.yml --ref feature/pose-landmark-keypoints
