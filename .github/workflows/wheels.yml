name: Wheels

on:
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "rustcpd/**"
      - "python/**"
      - ".github/workflows/wheels.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "rustcpd/**"
      - "python/**"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    name: release metadata
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' python/Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - platform: linux-aarch64
            runner: ubuntu-latest
            target: aarch64
          - platform: macos-universal2
            runner: macos-latest
            target: universal2-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # abi3-py39: one wheel per platform covers every CPython >= 3.9.
          args: --release --out dist --manifest-path python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  test:
    name: test (${{ matrix.platform }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, wheel-build baseline, and current CPython on
        # every OS; the same abi3 wheel serves all three.
        # 3.9 on macOS runs on the Intel runner (arm64 runners provide
        # 3.10+ only); the universal2 wheel covers both architectures.
        include:
          - { runner: ubuntu-latest, platform: linux-x86_64, python: "3.9" }
          - { runner: ubuntu-latest, platform: linux-x86_64, python: "3.12" }
          - { runner: ubuntu-latest, platform: linux-x86_64, python: "3.13" }
          - { runner: macos-latest, platform: macos-universal2, python: "3.12" }
          - { runner: macos-latest, platform: macos-universal2, python: "3.13" }
          - { runner: windows-latest, platform: windows-x64, python: "3.9" }
          - { runner: windows-latest, platform: windows-x64, python: "3.12" }
          - { runner: windows-latest, platform: windows-x64, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist
      - name: Install wheel and test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install --no-index --find-links dist rustcpd
          python -m pytest python/tests -q

  publish:
    name: publish to PyPI
    if: needs.release-metadata.outputs.should_release == 'true'
    needs: [release-metadata, build, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing (configure this repository + workflow at
      # https://pypi.org/manage/account/publishing/ — no API token needed).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    name: create GitHub release
    if: needs.release-metadata.outputs.should_release == 'true'
    needs: [release-metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from the changelog
        shell: bash
        run: |
          awk '
            /^## \[Unreleased\]/ { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md
